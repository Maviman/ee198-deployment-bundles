# Arena deployment topology -- read by the `arena` CLI (repo root).
#
# Don't edit this file for your site. Run
#     ./arena init --vision <user>@<vision-orin> --control <user>@<control-orin>
# which writes deploy/arena.local.conf (gitignored) with just your overrides.
# One Orin doing both jobs:  ./arena init --single <user>@<orin>
#
# Division of work (see ARENA.md):
#   vision  -- camera plugged in. Runs ONLY run_vision.py: capture -> detect ->
#              pose frames. Nothing else competes for its CPU.
#   control -- on the cars' WiFi, wired to the vision Orin. Runs the policy
#              (run_controller.py), the telemetry hub and the dashboard. This
#              is the box you (or `arena` over SSH) operate from.

[vision]
host = orin-vision.local
user =
repo = ~/ee198-deployment-bundles
python = python3

[control]
host = orin-control.local
user =
repo = ~/ee198-deployment-bundles
# the controller's venv (ORIN_DEPLOYMENT.md phase 1)
python = ~/.venvs/n1ctl/bin/python
# stdlib-only services (hub) and helpers
tools_python = python3

[fleet]
model = models/n1_catch
# auto = find the cars by broadcast (needs current firmware, or idle cars on
# old firmware); or ip0:8888,ip1:8888,... in CAR_INDEX order
esp = auto

[net]
# How the vision Orin reaches the control Orin (pose frames + telemetry).
# auto = resolve the control host name from the vision Orin. A direct Ethernet
# cable between the Orins with static addresses is the low-latency choice;
# put the control Orin's address on that link here (e.g. 10.42.0.2).
control_addr_from_vision = auto
# How the control Orin reaches the vision Orin (camera preview). auto = vision host.
vision_addr_from_control = auto
pose_port = 9870
telemetry_port = 9871
control_port = 9872
preview_port = 8090
dashboard_port = 8080
