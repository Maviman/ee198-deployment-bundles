; PlatformIO project for the EE198 pursuit-car command receiver.
; Board: ESP32-S3 DevKitC-1
;
; Open THIS folder (portable_n1_controller/esp32) in VS Code with the
; PlatformIO extension, or from a terminal:
;
;     pio run                 # compile
;     pio run -t upload       # flash (plug into the port labeled "UART"!)
;     pio device monitor      # serial monitor (shows IP address after boot)
;
; FLASHING NOTES for this specific board:
;  - The DevKitC-1 has TWO USB-C ports. Use the one labeled "UART" (CP2102N
;    bridge) for flashing + monitoring. The one labeled "USB" is the chip's
;    native USB and behaves differently (port can vanish/reappear mid-flash).
;  - If upload still times out at "Connecting....": hold the BOOT button,
;    tap RESET, release BOOT, retry the upload (manual download mode).

[platformio]
src_dir = esp32_receiver
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
; Platform PINNED on purpose. It ships Arduino-ESP32 core 2.0.17, and the
; sketch drives the steering servo through that core's LEDC API
; (ledcSetup/ledcAttachPin), which core 3.x removed. Leaving this unpinned
; means a future `pio` run can silently pull 3.x and fail to compile the
; steering half. Bump deliberately, and port the LEDC calls in the same commit.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; conservative flash speed -- raise to 921600 once uploads are proven reliable
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0

; Over-the-air flashing, used by `arena flash --ota` (repo root). Needs
; OTA_PASSWORD defined in esp32_receiver/wifi_credentials.h and one USB flash
; of this firmware first. The car accepts an update only while stopped.
;   pio run -e ota -t upload --upload-port <car-ip>
; (the arena CLI passes the password as PLATFORMIO_UPLOAD_FLAGS=--auth=...)
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = hive-car0.local
